<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字侠 — Word Hero</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4a017">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="文字侠">
  <meta property="og:title" content="文字侠 — Word Hero">
  <meta property="og:description" content="用文字力量拯救世界的中文学习RPG">
  <meta property="og:type" content="website">
  <!-- Howler.js for professional audio playback -->
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <!-- PixiJS for combat rendering effects -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.3/dist/pixi.min.js"></script>
  <style>
    /* Crisp pixel art rendering */
    img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <!-- Canvas layer for particle effects (behind game UI) -->
  <canvas id="particle-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>
  <!-- Meteor trail container -->
  <div class="meteor-container" id="meteor-container"></div>
  <div id="game-root"></div>
  <script>
    // Spawn random meteors
    function spawnMeteor() {
      const c = document.getElementById('meteor-container');
      if (!c) return;
      const m = document.createElement('div');
      m.className = 'meteor';
      m.style.left = (20 + Math.random() * 60) + '%';
      m.style.top = '-100px';
      m.style.animationDuration = (3 + Math.random() * 4) + 's';
      m.style.animationDelay = '0s';
      m.style.height = (40 + Math.random() * 80) + 'px';
      c.appendChild(m);
      setTimeout(() => m.remove(), 8000);
    }
    setInterval(spawnMeteor, 4000);
    setTimeout(spawnMeteor, 1000);
    setTimeout(spawnMeteor, 2500);
  </script>
  <script>
    // UNREGISTER any old service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
      });
    }
  </script>
  <!-- Lottie + Tone.js removed — unused, saving ~150K gzipped -->
  <script src="js/error-handler.js"></script>
  <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
